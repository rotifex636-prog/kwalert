plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Persistent keystore — har build (debug + release) isi se sign hoga.
// Password file se read hota hai, source me kabhi hardcode nahi.
// GitHub Actions par ye file nahi hoti — wahan default debug signing use hogi.
def keystoreFile = new File("/home/hatch/workspace/android-keystore/proxypilot.jks")
def passFile = new File("/home/hatch/workspace/android-keystore/.storepass")
def hasPersistentKey = keystoreFile.exists() && passFile.exists()
def storePass = hasPersistentKey ? passFile.text.trim() : ""

android {
    namespace 'com.shani.kwalert2'
    compileSdk 34

    defaultConfig {
        applicationId "com.shani.kwalert2"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.3"
    }

    signingConfigs {
        persistent {
            storeFile file("/home/hatch/workspace/android-keystore/proxypilot.jks")
            storePassword storePass
            keyAlias "proxypilot"
            keyPassword storePass
        }
    }

    buildTypes {
        debug {
            // Local par persistent keystore, GitHub par default debug signing.
            signingConfig hasPersistentKey ? signingConfigs.persistent : signingConfigs.debug
        }
        release {
            signingConfig hasPersistentKey ? signingConfigs.persistent : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
