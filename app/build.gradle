plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Persistent keystore — har build (debug + release) isi se sign hoga.
// Password file se read hota hai, source me kabhi hardcode nahi.
def storePass = new File("/home/hatch/workspace/android-keystore/.storepass").text.trim()

android {
    namespace 'com.shani.kwalert2'
    compileSdk 34

    defaultConfig {
        applicationId "com.shani.kwalert2"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.3"
    }

    signingConfigs {
        persistent {
            storeFile file("/home/hatch/workspace/android-keystore/proxypilot.jks")
            storePassword storePass
            keyAlias "proxypilot"
            keyPassword storePass
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.persistent
        }
        release {
            signingConfig signingConfigs.persistent
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
